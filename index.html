<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People</title>
  <style>
    :root {
      --paper: #f5e8cc;
      --ink: #513b2b;
      --gold: #b99a61;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(185, 154, 97, 0.28);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    ol {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    a {
      display: inline-block;
      padding: 14px 26px;
      border: 1px solid var(--gold);
      color: var(--ink);
      font-size: 18px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: background .3s, color .3s;
    }

    a:hover {
      background: var(--gold);
      color: #21180f;
    }

    a:focus:not(:focus-visible) {
      outline: none;
    }

    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <ol>
    <li><a href="ETimer.html">Dr. Esha Mugutmal</a></li>
    <li><a href="VTimer.html">Dr. Vaidavi Savale</a></li>
    <li><a href="NTimer.html">Dr. Neha Kharotia</a></li>
  </ol>
</body>
</html>
