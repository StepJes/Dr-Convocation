<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown to October 28, 2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080b18;
      --card: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --muted: #a5abc5;
      --accent: #8b5cf6;
      --cyan: #22d3ee;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 20%, #24205b 0%, transparent 45%),
        radial-gradient(ellipse at 85% 80%, #10364c 0%, transparent 45%),
        var(--bg);
    }

    /* Background stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #ffffffaa 50%, transparent),
        radial-gradient(1px 1px at 70% 20%, #ffffffaa 50%, transparent),
        radial-gradient(2px 2px at 80% 60%, #ffffff88 50%, transparent),
        radial-gradient(1px 1px at 35% 80%, #ffffff99 50%, transparent),
        radial-gradient(2px 2px at 55% 45%, #ffffff66 50%, transparent);
      background-size: 250px 250px;
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .container {
      width: min(900px, 92%);
      padding: 45px 25px;
      text-align: center;
      position: relative;
      /* auto margins centre the block vertically too, and unlike
         align-items: center they never clip the top when the content is
         taller than the viewport (small phones / landscape). */
      margin: auto;
      animation: appear 1s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge {
      display: inline-block;
      padding: 9px 18px;
      margin-bottom: 28px;
      border: 1px solid #8b5cf655;
      border-radius: 50px;
      background: #8b5cf618;
      color: #c4b5fd;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(36px, 7vw, 68px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    h1 span {
      display: block;
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(14px, 2.5vw, 18px);
      line-height: 1.7;
      margin-bottom: 48px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      max-width: 750px;
      margin: 0 auto 35px;
    }

    .time-box {
      position: relative;
      padding: 28px 10px 24px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid #ffffff15;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px #00000020;
      transition: transform 0.25s, border-color 0.25s;
    }

    .time-box:hover {
      transform: translateY(-5px);
      border-color: #8b5cf677;
    }

    .number {
      display: block;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      letter-spacing: -2px;
    }

    .label {
      display: block;
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .target-date {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 13px 22px;
      border-radius: 12px;
      background: #ffffff08;
      color: #d4d8eb;
      border: 1px solid #ffffff12;
      font-size: 14px;
    }

    .target-date .dot {
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--cyan);
    }

    #message {
      display: none;
      margin-top: 35px;
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 800;
      color: #67e8f9;
    }

    #message.show {
      display: block;
      animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Confetti canvas — blasts out of the page when the time is up */
    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
    }

    /* Smooth fade-out layer used right before redirecting to E-Letter.html */
    #fade-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.8s ease;
    }

    body.leaving #fade-overlay {
      opacity: 1;
    }

    footer {
      margin-top: 45px;
      font-size: 12px;
      color: #737b9b;
      letter-spacing: 1px;
    }

    @media (max-width: 520px) {
      .container {
        padding: 30px 5px;
      }

      .countdown {
        gap: 8px;
      }

      .time-box {
        padding: 22px 3px 18px;
        border-radius: 14px;
      }

      .number {
        font-size: clamp(27px, 8vw, 40px);
        letter-spacing: -1px;
      }

      .label {
        margin-top: 10px;
        font-size: 9px;
        letter-spacing: 1px;
      }

      h1 {
        letter-spacing: -1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body data-next="VTransition.html">
  <div class="stars"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="fade-overlay" aria-hidden="true"></div>

  <main class="container">
    <div class="badge">✦ The Countdown Begins ✦</div>

    <h1>
      Excited for what is
      <span>about to happen.</span>
    </h1>

    <p class="subtitle">
      I think it was mentioned not to check before date.<br />
      Hah, caught you!🧐
    </p>

    <p class="subtitle">
      Every second brings you closer. The moment is almost here.
    </p>

    <section class="countdown" aria-label="Time remaining">
      <div class="time-box">
        <span class="number" id="days">000</span>
        <span class="label">Days</span>
      </div>

      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <div class="target-date">
      <span class="dot"></span>
      <span>28 OCTOBER 2026</span>
    </div>

    <div id="message" role="status">
      ✨ The Moment Is Here! ✨
    </div>

    <footer>MAKE EVERY SECOND COUNT</footer>
  </main>

  <!-- Shared countdown + confetti + redirect logic (timer.js).
       The target date is configured once in timer.js. -->
  <script src="timer.js"></script>
</body>
</html>
